services:
  # Base de datos PostgreSQL
  - type: pserv
    name: chat-app-db
    databaseName: chatapp
    databaseUser: chatuser
    plan: free

  # Aplicación web
  - type: web
    name: chat-app
    env: node
    repo: https://github.com/CarlosCampoverde/Proyecto_I_Parcial.git
    rootDir: chat-app
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm run migrate && node server-scalable.js
    plan: free
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: USE_POSTGRES
        value: true
      - key: DATABASE_URL
        fromDatabase:
          name: chat-app-db
          property: connectionString
    autoDeploy: true
    branch: main